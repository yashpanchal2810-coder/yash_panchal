<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canva Design Templates | Yash Panchal</title>
    <meta name="description" content="A selection of Canva design templates by Yash Panchal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f3f7ff;
        --muted: #aebbd2;
        --bg: #07111d;
        --panel: #0e1d2d;
        --line: rgba(174, 203, 231, 0.18);
        --accent: #f5b544;
        --accent-2: #60c5c5;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        background: radial-gradient(circle at 80% 0%, rgba(96, 197, 197, 0.13), transparent 30%), var(--bg);
      }
      a { color: inherit; text-decoration: none; }
      .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
      .topbar { padding: 22px 0; border-bottom: 1px solid var(--line); background: rgba(7, 17, 29, 0.82); backdrop-filter: blur(12px); }
      .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 1.15rem; }
      .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; color: white; border-radius: 9px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); }
      .nav-actions { display: flex; align-items: center; gap: 16px; }
      .back-link { color: var(--accent); font-size: 0.92rem; font-weight: 700; }
      .back-link span { color: var(--accent-2); margin-right: 6px; }
      .theme-toggle { display: inline-grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: rgba(255, 255, 255, 0.08); font: inherit; font-size: 1.2rem; cursor: pointer; }
      .theme-toggle:hover { background: rgba(245, 181, 68, 0.2); }
      .intro { padding: 82px 0 52px; max-width: 850px; }
      .eyebrow { margin: 0 0 14px; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.18em; font-size: 0.76rem; font-weight: 700; }
      h1 { margin: 0; font-family: "Space Grotesk", sans-serif; font-size: clamp(2.6rem, 7vw, 5.7rem); line-height: 0.98; letter-spacing: -0.06em; }
      h1 span { color: var(--accent); }
      .intro p { max-width: 600px; margin: 24px 0 0; color: var(--muted); font-size: 1.08rem; line-height: 1.7; }
      .template-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding-bottom: 76px; }
      .template { display: flex; flex-direction: column; min-width: 0; overflow: hidden; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22); }
      .template img { width: 100%; aspect-ratio: 16 / 10; height: auto; display: block; object-fit: contain; background: #13283b; cursor: zoom-in; transition: opacity 0.2s ease; }
      .template:hover img { opacity: 0.86; }
      figcaption { display: flex; align-items: center; min-height: 48px; padding: 12px 15px; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--line); }
      .lightbox { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 28px; background: rgba(2, 7, 13, 0.94); }
      .lightbox.is-open { display: flex; }
      .lightbox img { width: auto; height: auto; max-width: min(96vw, 1500px); max-height: 88vh; object-fit: contain; border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5); }
      .lightbox-close { position: absolute; top: 22px; right: 24px; padding: 10px 18px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 8px; color: var(--ink); background: rgba(255, 255, 255, 0.1); font: inherit; font-weight: 700; cursor: pointer; }
      .lightbox-close:hover { background: rgba(245, 181, 68, 0.2); }
      body.lightbox-open { overflow: hidden; }
      body.light-mode {
        --ink: #172033;
        --muted: #58657a;
        --bg: #f7f9fc;
        --panel: #ffffff;
        --line: rgba(35, 52, 79, 0.16);
        background: linear-gradient(180deg, #ffffff 0%, #f5f8fc 100%);
      }
      body.light-mode .topbar { background: rgba(255, 255, 255, 0.86); }
      body.light-mode .theme-toggle { color: var(--ink); }
      body.light-mode .template { background: var(--panel); border-color: var(--line); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22); }
      body.light-mode .template img { background: #edf2f7; }
      .footer { padding: 22px 0 36px; color: var(--muted); border-top: 1px solid var(--line); font-size: 0.9rem; }
      @media (max-width: 720px) {
        .shell { width: min(100% - 28px, 560px); }
        .topbar { padding: 18px 0; }
        .intro { padding: 56px 0 34px; }
        .template-grid { grid-template-columns: 1fr; gap: 16px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="shell nav">
        <a class="brand" href="Yash.html#home" aria-label="Back to Yash Panchal portfolio">
          
          <span>YASH / CANVA</span>
        </a>
        <div class="nav-actions">
          
          <a class="back-link" href="Yash.html#projects"><span>←</span> Back to projects</a>
          <button class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode"><span aria-hidden="true">☀</span></button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="intro">
        <p class="eyebrow">Selected Canva work</p>
        <h1>Templates with<br /><span>a point of view.</span></h1>
        <p>Explore a few of my Canva designs for brands, education programs, and technology-focused campaigns. Each template is built to make the message clear and memorable.</p>
      </section>

      <section class="template-grid" aria-label="Canva design templates">
        <figure class="template">
          <img src="Image/1 (2).png" alt="NextGen Graphics promotional template" />
          <figcaption>NextGen Graphics Intro. poster</figcaption>
        </figure>
        <figure class="template">
          <img src="Image/1.png" alt="Expert session coding poster template" />
          <figcaption>AI and ML program brochure</figcaption>
        </figure>
        <figure class="template">
          <img src="Image/Blue White and Yellow Neon Gradient Modern Geometric 3D Robot Illustrative Technology Company Trifold Brochure (1).png" alt="AI and ML program brochure template" />
          <figcaption>Development Program Brochure</figcaption>
        </figure>
        <figure class="template">
          <img src="Image/Canva/vhhiring.png" alt="VH hiring promotional design" />
          <figcaption>VH hiring campaign design</figcaption>
        </figure>
        <figure class="template">
          <img src="Image/Canva/vhinternship.png" alt="VH internship promotional design" />
          <figcaption>VH internship campaign design</figcaption>
        </figure>
      </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Full screen image preview">
      <button class="lightbox-close" type="button" aria-label="Close full screen image">Cancel</button>
      <img id="lightbox-image" src="" alt="" />
    </div>

    <footer class="footer">
      <div class="shell">© <span id="year"></span> Yash Panchal. Canva design portfolio.</div>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      const themeToggle = document.querySelector(".theme-toggle");
      const themeIcon = themeToggle.querySelector("span");
      const savedTheme = localStorage.getItem("portfolio-theme") || "dark";

      function applyTheme(theme) {
        const isLight = theme === "light";
        document.body.classList.toggle("light-mode", isLight);
        themeIcon.textContent = isLight ? "☾" : "☀";
        themeToggle.setAttribute("aria-label", isLight ? "Switch to dark mode" : "Switch to light mode");
        themeToggle.title = isLight ? "Switch to dark mode" : "Switch to light mode";
      }

      applyTheme(savedTheme);
      themeToggle.addEventListener("click", () => {
        const nextTheme = document.body.classList.contains("light-mode") ? "dark" : "light";
        localStorage.setItem("portfolio-theme", nextTheme);
        applyTheme(nextTheme);
      });

      const lightbox = document.getElementById("lightbox");
      const lightboxImage = document.getElementById("lightbox-image");
      const closeButton = lightbox.querySelector(".lightbox-close");

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        document.body.classList.remove("lightbox-open");
        lightboxImage.src = "";
      }

      document.querySelectorAll(".template img").forEach((image) => {
        image.addEventListener("click", () => {
          lightboxImage.src = image.src;
          lightboxImage.alt = image.alt;
          lightbox.classList.add("is-open");
          document.body.classList.add("lightbox-open");
          closeButton.focus();
        });
      });

      closeButton.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeLightbox();
      });
    </script>
  </body>
</html>
